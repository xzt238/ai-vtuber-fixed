# 咕咕嘎嘎 AI-VTuber Docker Compose配置
# 支持多种部署场景

version: '3.8'

services:
  # 主应用服务
  gugugaga:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gugugaga-app
    restart: unless-stopped
    ports:
      - "12393:12393"  # HTTP端口
      - "12394:12394"  # WebSocket端口
    volumes:
      # 配置文件
      - ./app/config.yaml:/app/app/config.yaml:ro
      # 缓存目录
      - gugugaga-cache:/app/cache
      # 日志目录
      - gugugaga-logs:/app/logs
      # 记忆数据
      - gugugaga-memory:/app/memory
      # 模型文件（可选，如果需要本地模型）
      # - ./models:/app/models:ro
      # GPT-SoVITS模型（可选）
      # - ./GPT-SoVITS/GPT_weights_v3:/app/GPT-SoVITS/GPT_weights_v3:ro
      # - ./GPT-SoVITS/SoVITS_weights_v3:/app/GPT-SoVITS/SoVITS_weights_v3:ro
    environment:
      # 时区设置
      - TZ=Asia/Shanghai
      # Python配置
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # 应用配置
      - GUGUGAGA_WEB_PORT=12393
      - GUGUGAGA_WS_PORT=12394
      # API密钥（通过环境变量注入）
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    networks:
      - gugugaga-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12393/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Redis缓存服务（可选）
  redis:
    image: redis:7-alpine
    container_name: gugugaga-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gugugaga-redis:/data
    networks:
      - gugugaga-network
    command: redis-server --appendonly yes
    profiles:
      - with-redis

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: gugugaga-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gugugaga
    networks:
      - gugugaga-network
    profiles:
      - with-nginx

# 数据卷
volumes:
  gugugaga-cache:
    driver: local
  gugugaga-logs:
    driver: local
  gugugaga-memory:
    driver: local
  gugugaga-redis:
    driver: local

# 网络
networks:
  gugugaga-network:
    driver: bridge