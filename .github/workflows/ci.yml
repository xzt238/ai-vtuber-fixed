name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt || true

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short -m "not slow and not integration"
        env:
          PYTHONPATH: ${{ github.workspace }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          pip install flake8

      - name: Run flake8
        run: |
          flake8 app/ --max-line-length=120 --ignore=E501,W503,E402 --count --show-source --statistics
        continue-on-error: true

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'app'); from version import __version__; print(__version__)")
          echo "Version: $VERSION"
          grep -q "$VERSION" README.md || (echo "README version mismatch" && exit 1)
          echo "Version check passed"
