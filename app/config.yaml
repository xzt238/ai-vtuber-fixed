memory:
  auto_store: true
  decay_lambda: 0.005
  dedup_threshold: 0.95
  embedding_device: cpu
  embedding_model: BAAI/bge-base-zh-v1.5
  forgetting_threshold: 0.15
  grace_period_hours: 12.0
  retrieval_weights:
    keyword: 0.3
    recency: 0.2
    vector: 0.5
  summarize_batch: 5
  summarize_threshold: 20
  working_memory_limit: 30
multi_agent:
  conversation_timeout: 3600
  enabled: false
  max_agents: 10
plugin:
  auto_load: true
  enabled: true
  max_plugins: 50
  plugins_dir: ./plugins
proactive_speech:
  api_key: ${SUBAGENT_API_KEY}
  base_url: https://ccvibe.cc/v1
