asr:
  faster_whisper:
    device: auto
    download_root: ./models/hf
    model_size: small
  funasr:
    device: cuda
    model: paraformer-zh
  provider: funasr
desktop_pet:
  always_on_top: true
  click_action: greet
  draggable: true
  enabled: false
  height: 500
  transparent: true
  width: 400
diary:
  enabled: true
  max_context_items: 30
  time: '23:00'
live2d:
  enabled: true
  idle_motion: Idle
  model_path: ./app/web/assets/model/shizuku
live2d_idle_motion:
  breath_amplitude: 0.01
  enabled: true
  interval_max: 15
  interval_min: 5
  motions:
  - Idle
  - TapBody
  - Flick
llm:
  anthropic:
    api_key: ''
    base_url: https://api.anthropic.com
    max_tokens: 2048
    model: claude-sonnet-4-5-20250929
  deepseek:
    api_key: ''
    base_url: https://api.deepseek.com
    max_tokens: 2048
    model: deepseek-chat
  doubao:
    api_key: ''
    base_url: https://ark.cn-beijing.volces.com/api/v3
    max_tokens: 2048
    model: doubao-1.5-pro-32k
  enable_rag_injection: true
  glm:
    api_key: ''
    base_url: https://open.bigmodel.cn/api/paas/v4
    max_tokens: 2048
    model: GLM-4.7-FlashX
  kimi:
    api_key: ''
    base_url: https://api.moonshot.cn/v1
    max_tokens: 2048
    model: kimi-k2.6
  max_tokens: 2048
  mimo:
    api_key: ''
    base_url: https://api.xiaomimimo.com/v1
    max_tokens: 2048
    model: mimo-v2.5
  minimax:
    api_key: ''
    base_url: https://api.minimaxi.com/anthropic
    max_tokens: 2048
    model: MiniMax-M2.7
  ollama:
    api_key: ollama
    base_url: http://localhost:11434/v1
    max_tokens: 2048
    model: qwen3:8b
  openai:
    api_key: ''
    base_url: https://api.openai.com/v1
    max_tokens: 2048
    model: gpt-4o-mini
  provider: ollama
  qwen:
    api_key: ''
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    max_tokens: 2048
    model: qwen3.6-plus
mcp:
  enabled: true
  servers: {}
memory:
  auto_store: true
  decay_lambda: 0.005
  dedup_threshold: 0.95
  embedding_device: cpu
  embedding_model: BAAI/bge-base-zh-v1.5
  forgetting_threshold: 0.15
  grace_period_hours: 12.0
  retrieval_weights:
    keyword: 0.3
    recency: 0.2
    vector: 0.5
  summarize_batch: 5
  summarize_threshold: 20
  working_memory_limit: 30
proactive_speech:
  api_key: ${SUBAGENT_API_KEY}
  base_url: https://ccvibe.cc/v1
  check_interval: 30
  enabled: true
  idle_timeout: 120
  max_concurrent: 3
  max_daily_count: 15
  min_interval: 300
  model: ccvibe/claude-opus-4-6
  randomize_range: 30
subagent:
  enabled: true
text_enhancement:
  auto_detect: true
  chinese_features: true
  emotion_diffusion: true
  max_markers_per_reply: 3
  style: companion
tool_viz:
  auto_expand: false
  enabled: true
  show_input: true
  show_output: true
tts:
  edge:
    pitch: +0Hz
    rate: +0%
    voice: zh-CN-XiaoxiaoNeural
    volume: +0%
  fallback_engines:
  - edge
  gptsovits:
    device: cuda
    is_half: true
    root_dir: ./GPT-SoVITS
    version: v3
  provider: gptsovits
vad:
  stop_threshold_ms: 1800
  thinking_extend_ms: 2000
  thinking_pause_ms: 600
  thinking_threshold_factor: 0.8
vision:
  default_provider: minimax_vl
  minicpm:
    model_id: OpenBMB/MiniCPM-V-2
    model_path: ''
    use_int4: false
  minimax_vl:
    api_host: https://api.minimaxi.com
    api_key: ''
    jpeg_quality: 40
    model: MiniMax-VL-01
    timeout: 120
  rapidocr:
    enabled: true
voice_input:
  provider: web
vrm_display:
  arm_angle: 1.05
  model_scale: 1.0
  camera_distance: 3.8
  light_intensity: 2.5
  target_height: 1.0
  model_y: 0.0
  fov: 30.0
web:
  port: 12393
  ws_port: 12394
