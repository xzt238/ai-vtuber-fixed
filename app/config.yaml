  enabled: true
  idle_timeout: 120
  max_concurrent: 3
  max_daily_count: 15
  min_interval: 300
  model: ccvibe/claude-opus-4-6
  randomize_range: 30
rag:
  chunk_overlap: 50
  chunk_size: 500
  enabled: false
  retrieval_weights:
    keyword: 0.3
    vector: 0.7
  similarity_threshold: 0.7
