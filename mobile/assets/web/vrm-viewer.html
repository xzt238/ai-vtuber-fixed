<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { width: 100%; height: 100%; display: block; }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #6366f1;
      font-family: sans-serif;
      font-size: 14px;
    }
    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ef4444;
      font-family: sans-serif;
      font-size: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="vrm-canvas"></canvas>
  <div id="loading">加载 3D 模型中...</div>
  <div id="error"></div>
  
  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- GLTFLoader -->
  <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <script>
    // ========== VRM Viewer Engine ==========
    // Three.js + VRM 模型渲染
    
    const canvas = document.getElementById('vrm-canvas');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    
    // 场景设置
    const scene = new THREE.Scene();
    scene.background = null; // 透明背景
    
    // 相机
    const camera = new THREE.PerspectiveCamera(
      30,
      canvas.clientWidth / canvas.clientHeight,
      0.1,
      1000
    );
    camera.position.set(0, 1.2, 3);
    camera.lookAt(0, 1, 0);
    
    // 渲染器
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      alpha: true,
      antialias: true,
      premultipliedAlpha: false
    });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    
    // 控制器
    let controls = null;
    try {
      controls = new THREE.OrbitControls(camera, canvas);
      controls.target.set(0, 1, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.1;
      controls.enablePan = false;
      controls.minDistance = 1.5;
      controls.maxDistance = 5;
      controls.maxPolarAngle = Math.PI * 0.8;
      controls.update();
    } catch (e) {
      console.warn('OrbitControls not available');
    }
    
    // 灯光
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(1, 2, 3);
    directionalLight.castShadow = true;
    scene.add(directionalLight);
    
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
    fillLight.position.set(-1, 1, -1);
    scene.add(fillLight);
    
    // 地面（可选）
    const groundGeometry = new THREE.CircleGeometry(2, 32);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0xcccccc,
      transparent: true,
      opacity: 0.3
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);
    
    // ========== 模型管理 ==========
    let currentModel = null;
    let mixer = null;
    let clock = new THREE.Clock();
    
    // 动画状态
    const animationState = {
      blink: { value: 0, timer: 0, nextBlink: 3000, isBlinking: false },
      breath: { phase: 0 },
      lipSync: { value: 0, target: 0 },
      emotion: { current: 'neutral', target: 'neutral', value: 0 },
      head: { x: 0, y: 0, targetX: 0, targetY: 0 }
    };
    
    // 加载 VRM 模型
    async function loadVRM(url) {
      try {
        loadingEl.style.display = 'block';
        errorEl.style.display = 'none';
        
        // 使用 GLTFLoader 加载（VRM 基于 glTF）
        const loader = new THREE.GLTFLoader();
        
        const gltf = await new Promise((resolve, reject) => {
          loader.load(
            url,
            resolve,
            (progress) => {
              const percent = (progress.loaded / progress.total * 100).toFixed(0);
              loadingEl.textContent = `加载中 ${percent}%`;
            },
            reject
          );
        });
        
        // 清除旧模型
        if (currentModel) {
          scene.remove(currentModel);
        }
        
        currentModel = gltf.scene;
        
        // 调整模型大小和位置
        const box = new THREE.Box3().setFromObject(currentModel);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2 / maxDim;
        currentModel.scale.setScalar(scale);
        
        currentModel.position.y = -center.y * scale;
        currentModel.position.x = -center.x * scale;
        
        scene.add(currentModel);
        
        // 设置动画混合器
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(currentModel);
          
          // 播放第一个动画
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
        }
        
        loadingEl.style.display = 'none';
        
        // 通知 React Native
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          type: 'loaded',
          animations: gltf.animations?.map(a => a.name) || []
        }));
        
      } catch (error) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = `加载失败: ${error.message}`;
        
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          type: 'error',
          message: error.message
        }));
      }
    }
    
    // 加载默认模型（测试用立方体）
    function loadDefaultModel() {
      const geometry = new THREE.BoxGeometry(0.5, 1, 0.5);
      const material = new THREE.MeshStandardMaterial({ 
        color: 0x6366f1,
        roughness: 0.5,
        metalness: 0.1
      });
      const cube = new THREE.Mesh(geometry, material);
      cube.position.y = 0.5;
      scene.add(cube);
      currentModel = cube;
      
      loadingEl.style.display = 'none';
    }
    
    // ========== 动画系统 ==========
    
    // 眨眼动画
    function updateBlink(dt) {
      const { blink } = animationState;
      
      blink.timer += dt * 1000;
      
      if (!blink.isBlinking && blink.timer > blink.nextBlink) {
        blink.isBlinking = true;
        blink.timer = 0;
        blink.nextBlink = 2000 + Math.random() * 4000;
      }
      
      if (blink.isBlinking) {
        if (blink.timer < 80) {
          blink.value = blink.timer / 80;
        } else if (blink.timer < 160) {
          blink.value = 1 - (blink.timer - 80) / 80;
        } else {
          blink.value = 0;
          blink.isBlinking = false;
          blink.timer = 0;
        }
      }
      
      // 应用到模型（如果支持 morph targets）
      if (currentModel) {
        currentModel.traverse((child) => {
          if (child.morphTargetDictionary && child.morphTargetInfluences) {
            const blinkIndex = child.morphTargetDictionary['blink'];
            if (blinkIndex !== undefined) {
              child.morphTargetInfluences[blinkIndex] = blink.value;
            }
          }
        });
      }
    }
    
    // 呼吸动画
    function updateBreath(dt) {
      animationState.breath.phase += dt * 2;
      const breathValue = Math.sin(animationState.breath.phase) * 0.5 + 0.5;
      
      if (currentModel) {
        currentModel.traverse((child) => {
          if (child.morphTargetDictionary && child.morphTargetInfluences) {
            const breathIndex = child.morphTargetDictionary['breath'];
            if (breathIndex !== undefined) {
              child.morphTargetInfluences[breathIndex] = breathValue * 0.3;
            }
          }
        });
      }
    }
    
    // 口型同步
    function updateLipSync(dt) {
      const { lipSync } = animationState;
      
      lipSync.value += (lipSync.target - lipSync.value) * 0.3;
      
      if (lipSync.target === 0) {
        lipSync.value *= 0.95;
      }
      
      if (currentModel) {
        currentModel.traverse((child) => {
          if (child.morphTargetDictionary && child.morphTargetInfluences) {
            // 尝试不同的口型 morph targets
            const mouthShapes = ['aa', 'oh', 'ou', 'ee', 'ih'];
            const shapeIndex = Math.floor(Math.random() * mouthShapes.length);
            const mouthIndex = child.morphTargetDictionary[mouthShapes[shapeIndex]];
            
            if (mouthIndex !== undefined) {
              child.morphTargetInfluences[mouthIndex] = lipSync.value;
            }
            
            // 通用口型
            const mouthOpenIndex = child.morphTargetDictionary['mouthOpen'];
            if (mouthOpenIndex !== undefined) {
              child.morphTargetInfluences[mouthOpenIndex] = lipSync.value;
            }
          }
        });
      }
    }
    
    // 头部追踪
    function updateHeadTracking(dt) {
      const { head } = animationState;
      
      head.x += (head.targetX - head.x) * 0.1;
      head.y += (head.targetY - head.y) * 0.1;
      
      if (currentModel) {
        // 查找头部骨骼
        currentModel.traverse((child) => {
          if (child.name === 'Head' || child.name === 'head' || child.name === 'J_Bip_C_Head') {
            child.rotation.y = head.x * Math.PI / 180 * 0.5;
            child.rotation.x = head.y * Math.PI / 180 * 0.3;
          }
        });
      }
    }
    
    // 情感表情
    function setEmotion(emotion) {
      animationState.emotion.target = emotion;
      
      if (currentModel) {
        currentModel.traverse((child) => {
          if (child.morphTargetDictionary && child.morphTargetInfluences) {
            // 重置所有表情
            const emotionShapes = ['happy', 'angry', 'sad', 'relaxed', 'surprised'];
            emotionShapes.forEach(shape => {
              const index = child.morphTargetDictionary[shape];
              if (index !== undefined) {
                child.morphTargetInfluences[index] = 0;
              }
            });
            
            // 设置目标表情
            const targetIndex = child.morphTargetDictionary[emotion];
            if (targetIndex !== undefined) {
              child.morphTargetInfluences[targetIndex] = 1;
            }
          }
        });
      }
    }
    
    // ========== 主渲染循环 ==========
    function animate() {
      requestAnimationFrame(animate);
      
      const dt = clock.getDelta();
      
      // 更新动画
      if (mixer) {
        mixer.update(dt);
      }
      
      updateBlink(dt);
      updateBreath(dt);
      updateLipSync(dt);
      updateHeadTracking(dt);
      
      // 更新控制器
      if (controls) {
        controls.update();
      }
      
      // 渲染
      renderer.render(scene, camera);
    }
    
    // ========== 事件处理 ==========
    
    // 鼠标移动追踪
    canvas.addEventListener('mousemove', (e) => {
      const centerX = canvas.clientWidth / 2;
      const centerY = canvas.clientHeight / 3;
      
      animationState.head.targetX = (e.clientX - centerX) / centerX * 15;
      animationState.head.targetY = (e.clientY - centerY) / centerY * 10;
    });
    
    // 触摸事件
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const centerX = canvas.clientWidth / 2;
      const centerY = canvas.clientHeight / 3;
      
      animationState.head.targetX = (touch.clientX - centerX) / centerX * 15;
      animationState.head.targetY = (touch.clientY - centerY) / centerY * 10;
    });
    
    // 点击事件
    canvas.addEventListener('click', (e) => {
      window.ReactNativeWebView?.postMessage(JSON.stringify({
        type: 'click',
        x: e.clientX / canvas.clientWidth,
        y: e.clientY / canvas.clientHeight
      }));
    });
    
    // 窗口大小变化
    window.addEventListener('resize', () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    });
    
    // ========== React Native 通信 ==========
    
    // 设置口型同步
    function setLipSync(value) {
      animationState.lipSync.target = Math.min(1, Math.max(0, value));
    }
    
    // 播放动画
    function playAnimation(name) {
      if (mixer && currentModel) {
        // 停止当前动画
        mixer.stopAllAction();
        
        // 查找并播放指定动画
        // 这里需要模型包含对应的动画
        console.log('Play animation:', name);
      }
    }
    
    // 监听消息
    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        
        switch(data.type) {
          case 'loadVRM':
            loadVRM(data.url);
            break;
          case 'lipSync':
            setLipSync(data.value);
            break;
          case 'emotion':
            setEmotion(data.emotion);
            break;
          case 'animation':
            playAnimation(data.animation);
            break;
          case 'resetCamera':
            camera.position.set(0, 1.2, 3);
            if (controls) {
              controls.target.set(0, 1, 0);
              controls.update();
            }
            break;
        }
      } catch (e) {}
    });
    
    // 全局函数
    window.loadVRM = loadVRM;
    window.setLipSync = setLipSync;
    window.setEmotion = setEmotion;
    window.playAnimation = playAnimation;
    
    // ========== 启动 ==========
    loadDefaultModel();
    animate();
    
    // 通知已加载
    window.ReactNativeWebView?.postMessage(JSON.stringify({ type: 'ready' }));
  </script>
</body>
</html>
