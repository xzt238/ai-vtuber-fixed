<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="live2d"></canvas>
  <script>
    // ========== Live2D V2 Engine ==========
    // 口型同步 + 物理引擎 + 丰富表情 + 触摸交互
    
    const canvas = document.getElementById('live2d');
    const ctx = canvas.getContext('2d');
    
    // 响应式画布
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.offsetWidth * dpr;
      canvas.height = canvas.offsetHeight * dpr;
      ctx.scale(dpr, dpr);
    }
    resize();
    window.addEventListener('resize', resize);
    
    // ========== 配置 ==========
    const CONFIG = {
      // 物理引擎参数
      physics: {
        hair: { stiffness: 0.08, damping: 0.92, mass: 1.0 },
        cloth: { stiffness: 0.05, damping: 0.95, mass: 0.8 },
        tail: { stiffness: 0.06, damping: 0.90, mass: 1.2 }
      },
      // 口型同步参数
      lipSync: {
        sensitivity: 1.5,
        smoothing: 0.3,
        maxOpen: 0.8
      },
      // 动画速度
      animation: {
        blinkSpeed: 0.15,
        breathSpeed: 0.02,
        expressionSpeed: 0.1
      }
    };
    
    // ========== 状态管理 ==========
    const state = {
      time: 0,
      delta: 0,
      mouse: { x: 0, y: 0, pressed: false },
      
      // 口型同步
      lipSync: {
        value: 0,
        target: 0,
        vowel: 'a' // a, i, u, e, o
      },
      
      // 眨眼
      blink: {
        value: 0,
        timer: 0,
        nextBlink: 3000,
        isBlinking: false
      },
      
      // 呼吸
      breath: {
        value: 0,
        phase: 0
      },
      
      // 情感
      emotion: {
        current: 'neutral',
        target: 'neutral',
        value: 0,
        intensity: 0.5
      },
      
      // 物理引擎状态
      physics: {
        hair: [
          { x: 0, y: 0, vx: 0, vy: 0 },
          { x: 0, y: 0, vx: 0, vy: 0 },
          { x: 0, y: 0, vx: 0, vy: 0 }
        ],
        cloth: { x: 0, y: 0, vx: 0, vy: 0 },
        tail: { x: 0, y: 0, vx: 0, vy: 0, angle: 0, vAngle: 0 }
      },
      
      // 头部旋转
      head: {
        x: 0,
        y: 0,
        targetX: 0,
        targetY: 0,
        angle: 0
      },
      
      // 触摸反应
      touch: {
        area: null,
        reaction: 0,
        timer: 0
      }
    };
    
    // ========== 情感系统 ==========
    const EMOTIONS = {
      neutral: { color: '#6366f1', eyeScale: 1, mouthCurve: 0.1, browAngle: 0 },
      happy: { color: '#10b981', eyeScale: 1.1, mouthCurve: 0.5, browAngle: -5 },
      sad: { color: '#6b7280', eyeScale: 0.9, mouthCurve: -0.3, browAngle: 10 },
      angry: { color: '#ef4444', eyeScale: 0.85, mouthCurve: -0.2, browAngle: 15 },
      surprised: { color: '#f59e0b', eyeScale: 1.3, mouthCurve: 0.2, browAngle: -15 },
      love: { color: '#ec4899', eyeScale: 1.15, mouthCurve: 0.4, browAngle: -8 },
      thinking: { color: '#8b5cf6', eyeScale: 0.95, mouthCurve: 0, browAngle: 5 }
    };
    
    // ========== 母音口型 ==========
    const VOWEL_SHAPES = {
      a: { width: 1.0, height: 1.0, roundness: 0.3 },
      i: { width: 0.6, height: 0.4, roundness: 0.1 },
      u: { width: 0.5, height: 0.7, roundness: 0.8 },
      e: { width: 0.9, height: 0.6, roundness: 0.2 },
      o: { width: 0.6, height: 0.8, roundness: 0.9 }
    };
    
    // ========== 触摸区域 ==========
    const TOUCH_AREAS = {
      head: { cx: 0.5, cy: 0.25, r: 0.2 },
      cheek_left: { cx: 0.35, cy: 0.45, r: 0.1 },
      cheek_right: { cx: 0.65, cy: 0.45, r: 0.1 },
      body: { cx: 0.5, cy: 0.7, r: 0.25 }
    };
    
    // ========== 物理引擎 ==========
    function updatePhysics(dt) {
      const { physics: phys, head } = state;
      const gravity = 0.15;
      const wind = Math.sin(state.time * 0.001) * 0.5;
      
      // 头发物理
      phys.hair.forEach((hair, i) => {
        const spring = CONFIG.physics.hair.stiffness;
        const damping = CONFIG.physics.hair.damping;
        
        // 目标位置（跟随头部）
        const targetX = head.x * (0.5 + i * 0.2) + wind * (i + 1) * 0.3;
        const targetY = head.y * 0.3 + gravity * (i + 1) * 2;
        
        // 弹簧力
        const fx = (targetX - hair.x) * spring;
        const fy = (targetY - hair.y) * spring;
        
        hair.vx = (hair.vx + fx) * damping;
        hair.vy = (hair.vy + fy) * damping;
        hair.x += hair.vx * dt;
        hair.y += hair.vy * dt;
      });
      
      // 衣服物理
      const clothTarget = { x: head.x * 0.2 + wind, y: head.y * 0.1 + 2 };
      phys.cloth.vx = (phys.cloth.vx + (clothTarget.x - phys.cloth.x) * CONFIG.physics.cloth.stiffness) * CONFIG.physics.cloth.damping;
      phys.cloth.vy = (phys.cloth.vy + (clothTarget.y - phys.cloth.y) * CONFIG.physics.cloth.stiffness) * CONFIG.physics.cloth.damping;
      phys.cloth.x += phys.cloth.vx * dt;
      phys.cloth.y += phys.cloth.vy * dt;
      
      // 尾巴物理（如果有的话）
      const tailTarget = { x: head.x * 0.3 - 1, y: head.y * 0.2 + 5 };
      phys.tail.vx = (phys.tail.vx + (tailTarget.x - phys.tail.x) * CONFIG.physics.tail.stiffness) * CONFIG.physics.tail.damping;
      phys.tail.vy = (phys.tail.vy + (tailTarget.y - phys.tail.y) * CONFIG.physics.tail.stiffness) * CONFIG.physics.tail.damping;
      phys.tail.x += phys.tail.vx * dt;
      phys.tail.y += phys.tail.vy * dt;
      
      // 尾巴摆动
      phys.tail.angle = Math.sin(state.time * 0.003) * 0.3 + phys.tail.vx * 0.1;
    }
    
    // ========== 口型同步 ==========
    function updateLipSync(dt) {
      const { lipSync } = state;
      
      // 平滑过渡
      lipSync.value += (lipSync.target - lipSync.value) * CONFIG.lipSync.smoothing;
      
      // 如果没有音频输入，微微张嘴模拟呼吸
      if (lipSync.target === 0) {
        lipSync.value *= 0.95;
      }
      
      // 随机切换母音
      if (Math.random() < 0.02 && lipSync.value > 0.3) {
        const vowels = ['a', 'i', 'u', 'e', 'o'];
        lipSync.vowel = vowels[Math.floor(Math.random() * vowels.length)];
      }
    }
    
    // ========== 眨眼系统 ==========
    function updateBlink(dt) {
      const { blink } = state;
      
      blink.timer += dt;
      
      if (!blink.isBlinking && blink.timer > blink.nextBlink) {
        blink.isBlinking = true;
        blink.timer = 0;
        blink.nextBlink = 2000 + Math.random() * 4000;
      }
      
      if (blink.isBlinking) {
        if (blink.timer < 80) {
          blink.value = blink.timer / 80;
        } else if (blink.timer < 160) {
          blink.value = 1 - (blink.timer - 80) / 80;
        } else {
          blink.value = 0;
          blink.isBlinking = false;
          blink.timer = 0;
        }
      }
    }
    
    // ========== 呼吸系统 ==========
    function updateBreath(dt) {
      state.breath.phase += CONFIG.animation.breathSpeed * dt;
      state.breath.value = Math.sin(state.breath.phase) * 0.5 + 0.5;
    }
    
    // ========== 情感系统 ==========
    function updateEmotion(dt) {
      const { emotion } = state;
      
      if (emotion.current !== emotion.target) {
        emotion.value += CONFIG.animation.expressionSpeed * dt;
        if (emotion.value >= 1) {
          emotion.current = emotion.target;
          emotion.value = 0;
        }
      }
    }
    
    // ========== 头部追踪 ==========
    function updateHead(dt) {
      const { head, mouse } = state;
      
      // 鼠标/触摸追踪
      const centerX = canvas.offsetWidth / 2;
      const centerY = canvas.offsetHeight / 3;
      
      head.targetX = (mouse.x - centerX) / centerX * 15;
      head.targetY = (mouse.y - centerY) / centerY * 10;
      
      // 平滑跟随
      head.x += (head.targetX - head.x) * 0.08;
      head.y += (head.targetY - head.y) * 0.08;
      head.angle = head.x * 0.5;
    }
    
    // ========== 触摸检测 ==========
    function checkTouchArea(x, y) {
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      const nx = x / w;
      const ny = y / h;
      
      for (const [name, area] of Object.entries(TOUCH_AREAS)) {
        const dx = nx - area.cx;
        const dy = ny - area.cy;
        if (Math.sqrt(dx * dx + dy * dy) < area.r) {
          return name;
        }
      }
      return null;
    }
    
    // ========== 渲染函数 ==========
    
    // 绘制头发
    function drawHair(cx, cy) {
      const { physics: phys } = state;
      const emotionData = EMOTIONS[state.emotion.current];
      const baseColor = emotionData.color;
      
      // 主发束
      phys.hair.forEach((hair, i) => {
        const x = cx + hair.x;
        const y = cy - 40 + hair.y + i * 15;
        
        ctx.beginPath();
        ctx.moveTo(cx - 25 + i * 20, cy - 60);
        
        // 贝塞尔曲线模拟飘动
        const cp1x = x - 10 + Math.sin(state.time * 0.002 + i) * 5;
        const cp1y = y - 20;
        const cp2x = x + 5 + Math.cos(state.time * 0.003 + i) * 3;
        const cp2y = y + 10;
        const endx = x + phys.tail.x * (i * 0.2);
        const endy = y + 30 + phys.tail.y;
        
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, endx, endy);
        
        ctx.strokeStyle = i === 0 ? baseColor : adjustColor(baseColor, -20 + i * 10);
        ctx.lineWidth = 8 - i * 2;
        ctx.lineCap = 'round';
        ctx.stroke();
      });
    }
    
    // 绘制脸部
    function drawFace(cx, cy) {
      const { blink, breath, emotion } = state;
      const emotionData = EMOTIONS[emotion.current];
      const breathOffset = breath.value * 2;
      
      // 脸部轮廓
      ctx.beginPath();
      ctx.ellipse(cx, cy, 55, 65 + breathOffset, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#ffe0cc';
      ctx.fill();
      ctx.strokeStyle = '#e8b090';
      ctx.lineWidth = 1;
      ctx.stroke();
      
      // 腮红
      const blushAlpha = emotion.current === 'happy' || emotion.current === 'love' ? 0.4 : 0.2;
      ctx.beginPath();
      ctx.ellipse(cx - 30, cy + 10, 15, 8, 0, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 150, 150, ${blushAlpha})`;
      ctx.fill();
      
      ctx.beginPath();
      ctx.ellipse(cx + 30, cy + 10, 15, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // 眼睛
      const eyeScale = emotionData.eyeScale * (1 - blink.value * 0.9);
      drawEyes(cx, cy - 10, eyeScale);
      
      // 眉毛
      drawEyebrows(cx, cy - 30, emotionData.browAngle);
      
      // 嘴巴（口型同步）
      drawMouth(cx, cy + 25, emotionData.mouthCurve);
      
      // 鼻子
      ctx.beginPath();
      ctx.moveTo(cx, cy + 5);
      ctx.lineTo(cx - 3, cy + 12);
      ctx.lineTo(cx + 3, cy + 12);
      ctx.fillStyle = '#e8b090';
      ctx.fill();
    }
    
    // 绘制眼睛
    function drawEyes(cx, cy, scale) {
      const { head } = state;
      const eyeOffsetX = head.x * 0.3;
      const eyeOffsetY = head.y * 0.2;
      
      [-1, 1].forEach(side => {
        const ex = cx + side * 22 + eyeOffsetX;
        const ey = cy + eyeOffsetY;
        
        // 眼白
        ctx.beginPath();
        ctx.ellipse(ex, ey, 12 * scale, 14 * scale, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // 瞳孔
        const pupilScale = state.emotion.current === 'surprised' ? 0.7 : 0.5;
        ctx.beginPath();
        ctx.ellipse(ex + eyeOffsetX * 0.5, ey + eyeOffsetY * 0.3, 
                    6 * scale * pupilScale, 7 * scale * pupilScale, 0, 0, Math.PI * 2);
        ctx.fillStyle = state.emotion.current === 'love' ? '#ec4899' : '#4a5568';
        ctx.fill();
        
        // 高光
        ctx.beginPath();
        ctx.ellipse(ex + 2 + eyeOffsetX * 0.3, ey - 2, 2.5, 3, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fill();
        
        // 小高光
        ctx.beginPath();
        ctx.ellipse(ex - 1 + eyeOffsetX * 0.2, ey + 3, 1.5, 1.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fill();
        
        // 爱心眼（love情感时）
        if (state.emotion.current === 'love' && scale > 0.5) {
          drawHeart(ex, ey, 8 * scale);
        }
      });
    }
    
    // 绘制爱心
    function drawHeart(cx, cy, size) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(size / 10, size / 10);
      
      ctx.beginPath();
      ctx.moveTo(0, -3);
      ctx.bezierCurveTo(-5, -8, -12, -5, -12, 0);
      ctx.bezierCurveTo(-12, 5, 0, 12, 0, 15);
      ctx.bezierCurveTo(0, 12, 12, 5, 12, 0);
      ctx.bezierCurveTo(12, -5, 5, -8, 0, -3);
      
      ctx.fillStyle = '#ec4899';
      ctx.fill();
      ctx.restore();
    }
    
    // 绘制眉毛
    function drawEyebrows(cx, cy, angle) {
      const { head } = state;
      
      [-1, 1].forEach(side => {
        const bx = cx + side * 25 + head.x * 0.2;
        const by = cy + head.y * 0.1;
        
        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(side * angle * Math.PI / 180);
        
        ctx.beginPath();
        ctx.moveTo(-12, 0);
        ctx.quadraticCurveTo(0, -5, 12, 0);
        ctx.strokeStyle = '#5d4e37';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();
        
        ctx.restore();
      });
    }
    
    // 绘制嘴巴（口型同步）
    function drawMouth(cx, cy, curve) {
      const { lipSync } = state;
      const vowelShape = VOWEL_SHAPES[lipSync.vowel];
      
      const openAmount = lipSync.value * CONFIG.lipSync.maxOpen;
      const mouthWidth = 15 + openAmount * 10 * vowelShape.width;
      const mouthHeight = 3 + openAmount * 12 * vowelShape.height;
      
      ctx.save();
      ctx.translate(cx, cy);
      
      // 嘴巴形状
      ctx.beginPath();
      if (openAmount > 0.1) {
        // 张嘴
        const roundness = vowelShape.roundness;
        ctx.moveTo(-mouthWidth, curve * 5);
        ctx.quadraticCurveTo(-mouthWidth * roundness, -mouthHeight, 0, -mouthHeight);
        ctx.quadraticCurveTo(mouthWidth * roundness, -mouthHeight, mouthWidth, curve * 5);
        ctx.quadraticCurveTo(mouthWidth * roundness, mouthHeight * 1.5, 0, mouthHeight * 1.5);
        ctx.quadraticCurveTo(-mouthWidth * roundness, mouthHeight * 1.5, -mouthWidth, curve * 5);
        
        ctx.fillStyle = '#cc6666';
        ctx.fill();
        
        // 舌头（某些母音时显示）
        if (lipSync.vowel === 'a' || lipSync.vowel === 'e') {
          ctx.beginPath();
          ctx.ellipse(0, mouthHeight * 0.8, mouthWidth * 0.4, mouthHeight * 0.4, 0, 0, Math.PI);
          ctx.fillStyle = '#ff8888';
          ctx.fill();
        }
      } else {
        // 闭嘴（微笑或平嘴）
        ctx.moveTo(-12, curve * 5);
        ctx.quadraticCurveTo(0, curve * 15, 12, curve * 5);
        ctx.strokeStyle = '#cc6666';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      
      ctx.restore();
    }
    
    // 绘制身体
    function drawBody(cx, cy) {
      const { physics: phys, breath } = state;
      const emotionData = EMOTIONS[state.emotion.current];
      const breathOffset = breath.value * 3;
      
      // 身体轮廓
      ctx.beginPath();
      ctx.moveTo(cx - 35, cy + 40);
      ctx.quadraticCurveTo(cx - 45, cy + 80, cx - 30 + phys.cloth.x, cy + 120 + phys.cloth.y);
      ctx.lineTo(cx + 30 + phys.cloth.x, cy + 120 + phys.cloth.y);
      ctx.quadraticCurveTo(cx + 45, cy + 80, cx + 35, cy + 40);
      ctx.closePath();
      
      ctx.fillStyle = emotionData.color;
      ctx.fill();
      ctx.strokeStyle = adjustColor(emotionData.color, -30);
      ctx.lineWidth = 1;
      ctx.stroke();
      
      // 衣领装饰
      ctx.beginPath();
      ctx.moveTo(cx - 20, cy + 40);
      ctx.lineTo(cx, cy + 55 + breathOffset);
      ctx.lineTo(cx + 20, cy + 40);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    
    // 绘制尾巴（可选）
    function drawTail(cx, cy) {
      const { physics: phys } = state;
      
      ctx.save();
      ctx.translate(cx + 20, cy + 80);
      ctx.rotate(phys.tail.angle);
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(
        20 + phys.tail.x, -30 + phys.tail.y,
        10 + phys.tail.x * 1.5, -60 + phys.tail.y
      );
      
      ctx.strokeStyle = EMOTIONS[state.emotion.current].color;
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.stroke();
      
      // 尾巴尖端
      ctx.beginPath();
      ctx.arc(10 + phys.tail.x * 1.5, -60 + phys.tail.y, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      
      ctx.restore();
    }
    
    // ========== 辅助函数 ==========
    function adjustColor(hex, amount) {
      const r = Math.max(0, Math.min(255, parseInt(hex.slice(1, 3), 16) + amount));
      const g = Math.max(0, Math.min(255, parseInt(hex.slice(3, 5), 16) + amount));
      const b = Math.max(0, Math.min(255, parseInt(hex.slice(5, 7), 16) + amount));
      return `rgb(${r}, ${g}, ${b})`;
    }
    
    // ========== 主渲染循环 ==========
    let lastTime = performance.now();
    
    function render(currentTime) {
      const dt = Math.min(currentTime - lastTime, 50);
      lastTime = currentTime;
      state.time = currentTime;
      state.delta = dt;
      
      // 更新系统
      updatePhysics(dt);
      updateLipSync(dt);
      updateBlink(dt);
      updateBreath(dt);
      updateEmotion(dt);
      updateHead(dt);
      
      // 清空画布
      ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);
      
      // 角色中心
      const cx = canvas.offsetWidth / 2 + state.head.x;
      const cy = canvas.offsetHeight * 0.4 + state.head.y;
      
      // 应用头部旋转
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(state.head.angle * Math.PI / 180 * 0.3);
      ctx.translate(-cx, -cy);
      
      // 渲染顺序（后往前）
      drawTail(cx, cy);
      drawHair(cx, cy);
      drawBody(cx, cy);
      drawFace(cx, cy);
      
      // 触摸反馈
      if (state.touch.reaction > 0) {
        drawTouchFeedback(cx, cy);
        state.touch.reaction *= 0.95;
      }
      
      ctx.restore();
      
      requestAnimationFrame(render);
    }
    
    // 绘制触摸反馈
    function drawTouchFeedback(cx, cy) {
      const { touch } = state;
      
      // 光晕效果
      ctx.beginPath();
      ctx.arc(cx, cy - 20, 60 + (1 - touch.reaction) * 40, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 200, 100, ${touch.reaction * 0.3})`;
      ctx.fill();
      
      // 爱心粒子
      if (touch.area === 'head' || touch.area === 'cheek_left' || touch.area === 'cheek_right') {
        for (let i = 0; i < 3; i++) {
          const angle = (state.time * 0.005 + i * Math.PI * 2 / 3) % (Math.PI * 2);
          const radius = 40 + (1 - touch.reaction) * 30;
          const px = cx + Math.cos(angle) * radius;
          const py = cy - 20 + Math.sin(angle) * radius - (1 - touch.reaction) * 50;
          
          ctx.save();
          ctx.globalAlpha = touch.reaction;
          drawHeart(px, py, 6);
          ctx.restore();
        }
      }
    }
    
    // ========== 事件处理 ==========
    
    // 鼠标移动
    canvas.addEventListener('mousemove', (e) => {
      state.mouse.x = e.offsetX;
      state.mouse.y = e.offsetY;
    });
    
    // 触摸开始
    canvas.addEventListener('mousedown', (e) => {
      state.mouse.pressed = true;
      const area = checkTouchArea(e.offsetX, e.offsetY);
      if (area) {
        state.touch.area = area;
        state.touch.reaction = 1;
        state.touch.timer = 0;
        
        // 不同区域不同反应
        switch(area) {
          case 'head':
            // 开心
            setEmotion('happy', 3000);
            break;
          case 'cheek_left':
          case 'cheek_right':
            // 害羞
            setEmotion('love', 3000);
            break;
          case 'body':
            // 惊喜
            setEmotion('surprised', 2000);
            break;
        }
        
        // 通知 React Native
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          type: 'touch',
          area: area
        }));
      }
    });
    
    // 触摸结束
    canvas.addEventListener('mouseup', () => {
      state.mouse.pressed = false;
    });
    
    // 触摸事件（移动端）
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      state.mouse.x = touch.clientX - rect.left;
      state.mouse.y = touch.clientY - rect.top;
      
      const area = checkTouchArea(state.mouse.x, state.mouse.y);
      if (area) {
        state.touch.area = area;
        state.touch.reaction = 1;
        
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          type: 'touch',
          area: area
        }));
      }
    });
    
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      state.mouse.x = touch.clientX - rect.left;
      state.mouse.y = touch.clientY - rect.top;
    });
    
    // ========== React Native 通信 ==========
    
    // 设置口型同步值
    function setLipSync(value) {
      state.lipSync.target = Math.min(1, Math.max(0, value * CONFIG.lipSync.sensitivity));
    }
    
    // 设置情感
    function setEmotion(emotion, duration = 0) {
      if (EMOTIONS[emotion]) {
        state.emotion.target = emotion;
        state.emotion.value = 0;
        
        // 自动恢复
        if (duration > 0) {
          setTimeout(() => {
            state.emotion.target = 'neutral';
            state.emotion.value = 0;
          }, duration);
        }
      }
    }
    
    // 设置情感强度
    function setEmotionIntensity(intensity) {
      state.emotion.intensity = Math.min(1, Math.max(0, intensity));
    }
    
    // 播放动画
    function playAnimation(name) {
      switch(name) {
        case 'happy':
          setEmotion('happy', 3000);
          break;
        case 'sad':
          setEmotion('sad', 5000);
          break;
        case 'angry':
          setEmotion('angry', 3000);
          break;
        case 'surprised':
          setEmotion('surprised', 2000);
          break;
        case 'love':
          setEmotion('love', 4000);
          break;
        case 'thinking':
          setEmotion('thinking', 5000);
          break;
        case 'nod':
          // 点头动画
          state.head.targetY = 10;
          setTimeout(() => { state.head.targetY = -5; }, 300);
          setTimeout(() => { state.head.targetY = 0; }, 600);
          break;
        case 'shake':
          // 摇头动画
          state.head.targetX = -10;
          setTimeout(() => { state.head.targetX = 10; }, 200);
          setTimeout(() => { state.head.targetX = -5; }, 400);
          setTimeout(() => { state.head.targetX = 0; }, 600);
          break;
      }
    }
    
    // 监听来自 React Native 的消息
    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        
        switch(data.type) {
          case 'lipSync':
            setLipSync(data.value);
            break;
          case 'emotion':
            setEmotion(data.emotion, data.duration);
            break;
          case 'animation':
            playAnimation(data.animation);
            break;
          case 'intensity':
            setEmotionIntensity(data.value);
            break;
        }
      } catch (e) {}
    });
    
    // 也支持直接调用
    window.setLipSync = setLipSync;
    window.setEmotion = setEmotion;
    window.playAnimation = playAnimation;
    
    // ========== 启动 ==========
    requestAnimationFrame(render);
    
    // 通知 React Native 已加载完成
    window.ReactNativeWebView?.postMessage(JSON.stringify({ type: 'ready' }));
  </script>
</body>
</html>
